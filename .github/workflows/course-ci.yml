name: Course repository QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked student environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Compile trainer scripts
        run: python -m compileall -q scripts

      - name: Check local course environment
        run: python scripts/check_environment.py

      - name: Verify committed fallback tables
        run: python scripts/build_local_fallback_tables.py --check

      - name: Validate course repository
        run: python scripts/validate_course.py
