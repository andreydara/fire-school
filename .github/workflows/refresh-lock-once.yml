name: Refresh course requirements lock

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-lock-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pip-tools
      - run: pip-compile --resolver=backtracking --strip-extras --output-file=requirements-lock.txt requirements.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python scripts/check_environment.py
      - run: python scripts/validate_course.py
      - name: Commit refreshed lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-lock.txt
          if git diff --cached --quiet; then
            echo "Lock unchanged"
          else
            git commit -m "Refresh tested Python 3.11 course lock"
            git push
          fi
