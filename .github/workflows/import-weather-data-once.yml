name: Import summer-school weather data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-weather-data-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install download and validation tools
        run: python -m pip install --upgrade gdown netCDF4

      - name: Download final ERA5-Land course subsets
        run: |
          mkdir -p data/weather
          gdown "https://drive.google.com/uc?id=123L76VTgfMDrQn1ZqCsaDbSGwYCm0iwe" -O data/weather/era5_land_galicica_hourly_2024.nc
          gdown "https://drive.google.com/uc?id=1Q7OH89RytE-ahyrjf8bwJztOYLw_fHY6" -O data/weather/era5_land_galicica_fireseason_1991_latest.nc

      - name: Validate downloaded NetCDF files
        run: |
          python - <<'PY'
          from pathlib import Path
          from netCDF4 import Dataset

          files = {
              Path("data/weather/era5_land_galicica_hourly_2024.nc"): 11523312,
              Path("data/weather/era5_land_galicica_fireseason_1991_latest.nc"): 18675609,
          }

          for path, expected_size in files.items():
              actual = path.stat().st_size
              if actual != expected_size:
                  raise RuntimeError(
                      f"{path} has {actual} bytes; expected {expected_size}"
                  )

              with Dataset(path) as ds:
                  if "time" not in ds.dimensions:
                      raise RuntimeError(f"{path} has no time dimension")
                  if len(ds.dimensions["time"]) == 0:
                      raise RuntimeError(f"{path} has an empty time dimension")
                  print(
                      f"OK: {path} — "
                      f"{actual / 1024**2:.1f} MB, "
                      f"{len(ds.dimensions['time'])} time steps"
                  )
          PY

      - name: Commit weather datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather/era5_land_galicica_hourly_2024.nc
          git add data/weather/era5_land_galicica_fireseason_1991_latest.nc

          if git diff --cached --quiet; then
            echo "Weather datasets are already present and unchanged."
          else
            git commit -m "Add ERA5-Land weather datasets for summer school"
            git push
          fi
