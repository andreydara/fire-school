name: Build course requirements lock

on:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - ".github/workflows/build-course-lock-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build deterministic lock
        run: |
          python -m pip install --upgrade pip pip-tools
          pip-compile             --resolver=backtracking             --strip-extras             --output-file=requirements-lock.txt             requirements.txt

      - name: Install locked environment
        run: python -m pip install -r requirements-lock.txt

      - name: Validate local course environment
        run: python scripts/check_environment.py

      - name: Validate repository
        run: python scripts/validate_course.py

      - name: Commit lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-lock.txt
          if git diff --cached --quiet; then
            echo "requirements-lock.txt is unchanged"
          else
            git commit -m "Add tested Python 3.11 course lock"
            git push
          fi
